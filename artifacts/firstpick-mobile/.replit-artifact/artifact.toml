kind = "mobile"
previewPath = "/firstpick-mobile/"
title = "FirstPick Mobile"
description = "FirstPick — Dubai streetwear iOS app. Browse drops, add to cart, checkout via COD, track orders. Dynamic Island Live Activity + Home Screen widget for order status. Space Grotesk font, pure black/orange design."
version = "1.0.0"
id = "artifacts/firstpick-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/firstpick-mobile/" ]
localPort = 25292

[services.development]
run = "pnpm --filter @workspace/firstpick-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/firstpick-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/firstpick-mobile", "run", "serve" ]

[services.env]
PORT = "25292"
BASE_PATH = "/firstpick-mobile/"
