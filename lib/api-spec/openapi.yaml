openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: IMAGINATE e-commerce API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: products
  - name: categories
  - name: cart
  - name: orders
  - name: payments
  - name: store
  - name: content
  - name: settings
  - name: reviews
  - name: tiktok
paths:
  /published/{kind}:
    get:
      operationId: listPublishedContent
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Currently published documents
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ManagedDocument" } }
  /published/{kind}/{slug}:
    get:
      operationId: getPublishedContent
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string } }
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Published document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedDocument" }
        "404": { description: Not published }
  /manage/{kind}:
    get:
      operationId: listManagedContent
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Admin documents
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ManagedDocument" } }
        "401": { description: Authentication required }
        "403": { description: Permission required }
    post:
      operationId: createManagedContent
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManagedDocumentInput" }
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedDocument" }
        "400": { description: Invalid input }
        "403": { description: Permission required }
  /manage/{kind}/{id}:
    patch:
      operationId: updateManagedContent
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManagedDocumentInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedDocument" }
        "400": { description: Invalid input }
        "403": { description: Permission required }
    delete:
      operationId: archiveManagedContent
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Archived }
  /support:
    get:
      operationId: listOwnSupportRequests
      responses:
        "200":
          description: Requests owned by this customer or guest session
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SupportRequest" } }
    post:
      operationId: createSupportRequest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportRequestInput" }
      responses:
        "201":
          description: Received
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportRequest" }
        "400": { description: Invalid input }
        "429": { description: Please wait }
  /newsletter:
    post:
      operationId: subscribeNewsletter
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewsletterConsent" }
      responses:
        "201": { description: Subscribed with consent }
        "400": { description: Email and consent required }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createCategory
      tags: [categories]
      summary: Create a category (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  /categories/{id}:
    patch:
      operationId: updateCategory
      tags: [categories]
      summary: Update a category (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
    delete:
      operationId: deleteCategory
      tags: [categories]
      summary: Delete a category (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List products
      parameters:
        - name: collection
          in: query
          schema:
            type: string
        - name: preorderOnly
          in: query
          description: Available pre-orders across the main store and Basics.
          schema:
            type: boolean
        - name: categoryId
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
        - name: featured
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          description: Optional maximum number of products for small storefront sections.
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a product (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update a product (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a product (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /cart:
    get:
      operationId: getCart
      tags: [cart]
      summary: Get cart
      responses:
        "200":
          description: Cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"

  /cart/items:
    post:
      operationId: addToCart
      tags: [cart]
      summary: Add to cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartItemInput"
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"

  /cart/items/{id}:
    patch:
      operationId: updateCartItem
      tags: [cart]
      summary: Update cart item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartItemUpdate"
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
    delete:
      operationId: removeCartItem
      tags: [cart]
      summary: Remove from cart
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"

  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List all orders (admin)
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create order (checkout)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/track:
    get:
      operationId: trackOrder
      tags: [orders]
      summary: Track an order by order number and phone
      parameters:
        - name: orderNumber
          in: query
          required: true
          schema:
            type: string
        - name: phone
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order tracking info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderTracking"
        "404":
          description: Not found

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found
    patch:
      operationId: updateOrder
      tags: [orders]
      summary: Update order (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
    delete:
      operationId: deleteOrder
      tags: [orders]
      summary: Delete order (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /orders/{id}/status:
    patch:
      operationId: updateOrderStatus
      tags: [orders]
      summary: Update order status (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}/tracking:
    post:
      operationId: addTrackingEvent
      tags: [orders]
      summary: Add tracking event (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackingEventInput"
      responses:
        "201":
          description: Event added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingEvent"

  /payments/ziina-intent:
    post:
      operationId: createZiinaPaymentIntent
      tags: [payments]
      summary: Create Ziina payment intent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZiinaPaymentIntentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZiinaPaymentIntent"

  /payments/ziina-checkout:
    post:
      operationId: createZiinaCheckout
      tags: [payments]
      summary: Create order + Ziina intent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZiinaCheckout"

  /store/stats:
    get:
      operationId: getStoreStats
      tags: [store]
      summary: Store statistics (admin)
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreStats"

  /content/{slug}:
    get:
      operationId: getContentPage
      tags: [content]
      summary: Get content page
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Content page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentPage"
    put:
      operationId: updateContentPage
      tags: [content]
      summary: Update content page (admin)
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentPageInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentPage"

  /settings:
    get:
      operationId: getAllSettings
      tags: [settings]
      summary: Get all site settings
      responses:
        "200":
          description: Settings map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsMap"

  /settings/{key}:
    put:
      operationId: upsertSetting
      tags: [settings]
      summary: Set a site setting (admin)
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setting"

  /settings/bulk:
    post:
      operationId: bulkUpsertSettings
      tags: [settings]
      summary: Bulk update settings (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsMap"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsMap"

  /reviews:
    get:
      operationId: listReviews
      tags: [reviews]
      summary: List visible reviews
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"
    post:
      operationId: createReview
      tags: [reviews]
      summary: Create review (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"

  /reviews/{id}:
    patch:
      operationId: updateReview
      tags: [reviews]
      summary: Update review (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
    delete:
      operationId: deleteReview
      tags: [reviews]
      summary: Delete review (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /tiktok:
    get:
      operationId: listTiktokVideos
      tags: [tiktok]
      summary: List TikTok videos
      responses:
        "200":
          description: Videos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TiktokVideo"
    post:
      operationId: createTiktokVideo
      tags: [tiktok]
      summary: Add TikTok video (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TiktokVideoInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TiktokVideo"

  /tiktok/{id}:
    patch:
      operationId: updateTiktokVideo
      tags: [tiktok]
      summary: Update TikTok video (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TiktokVideoUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TiktokVideo"
    delete:
      operationId: deleteTiktokVideo
      tags: [tiktok]
      summary: Delete TikTok video (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /launch-state:
    get:
      operationId: getLaunchState
      responses:
        '200':
          description: Server clock, published countdown and available pre-order count.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /traffic/track:
    post:
      operationId: trackAnonymousTraffic
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnonymousTrafficInput' }
      responses:
        '200':
          description: Anonymous activity measured.
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean } } }
  /admin/live-traffic:
    get:
      operationId: getLiveTraffic
      responses:
        '200':
          description: Real measured anonymous traffic, business-timezone periods and monthly history.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /customer-notifications/preferences:
    get:
      operationId: getCustomerNotificationPreferences
      responses:
        '200':
          description: Current customer's notification preferences.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerNotificationPreferences' }
    patch:
      operationId: updateCustomerNotificationPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerNotificationPreferences' }
      responses:
        '200':
          description: Preferences saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerNotificationPreferences' }
  /customer-notifications/subscribe:
    post:
      operationId: subscribeCustomerNotifications
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerPushSubscriptionInput' }
      responses:
        '200':
          description: Explicit consent and browser subscription saved, not a delivery claim.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerNotificationPreferences' }
  /admin/customer-notifications:
    get:
      operationId: getCustomerNotificationCampaigns
      responses:
        '200':
          description: Campaigns, provider configuration and marketing limits.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
    post:
      operationId: createCustomerNotificationCampaign
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerNotificationCampaignInput' }
      responses:
        '201':
          description: Draft or scheduled customer marketing campaign saved.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /admin/customer-notifications/templates:
    get:
      operationId: getCustomerNotificationTemplates
      responses:
        '200':
          description: Customer-only message templates, never automatically sent to fill a quota.
          content:
            application/json:
              schema: { type: array, items: { type: object, additionalProperties: true } }
  /admin/customer-notifications/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    patch:
      operationId: editCustomerNotificationCampaign
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerNotificationCampaignInput' }
      responses:
        '200':
          description: Unsent campaign updated.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
    delete:
      operationId: deleteCustomerNotificationCampaign
      responses:
        '204': { description: Unsent campaign deleted. }
  /admin/customer-notifications/{id}/send:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      operationId: sendCustomerNotificationCampaign
      responses:
        '200':
          description: Actual provider acceptance counts; acceptance is not proof of display on a device.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
components:
  schemas:
    AnonymousTrafficInput:
      type: object
      required: [visitorId, page]
      properties:
        visitorId: { type: string }
        page: { type: string }
        deviceType: { type: string, enum: [desktop, mobile, tablet] }
        pageChanged: { type: boolean }
    CustomerPushSubscriptionInput:
      type: object
